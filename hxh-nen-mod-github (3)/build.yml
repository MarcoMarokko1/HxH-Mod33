name: Build Mod

on:
push:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - uses: gradle/actions/setup-gradle@v3
    with:
      gradle-version: 8.1.1
      cache-disabled: true

  - name: Check project folder
    run: |
      pwd
      ls -la
      find . -maxdepth 4 -name "build.gradle" -o -name "settings.gradle"

  - name: Build
    working-directory: ./hxh-nen-mod-github (3)
    run: gradle build --no-daemon

  - name: Upload Mod
    uses: actions/upload-artifact@v4
    with:
      name: hxhmod-jar
      path: hxh-nen-mod-github (3)/build/libs/*.jar
