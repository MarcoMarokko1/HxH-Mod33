name: Build Mod

'on':
push:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Find Gradle files
    run: |
      pwd
      ls -la
      find . -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'build.gradle' -o -name 'build.gradle.kts' \)

  - name: Build
    shell: bash
    run: |
      SETTINGS="$(find . -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)"
      if [ -z "$SETTINGS" ]; then
        echo "ERROR: No settings.gradle found in repository."
        exit 1
      fi
      PROJECT_DIR="$(dirname "$SETTINGS")"
      echo "Building in: $PROJECT_DIR"
      cd "$PROJECT_DIR"
      gradle build --no-daemon --no-build-cache

  - name: Upload Mod
    uses: actions/upload-artifact@v4
    with:
      name: hxhmod-jar
      path: '**/build/libs/*.jar'
      if-no-files-found: error
